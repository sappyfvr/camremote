<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cam Remote">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Cam Remote</title>
<style>
  :root {
    --glass: rgba(28, 28, 30, .55);
    --muted: rgba(255, 255, 255, .72);
    --red: #ff3b30;
    --green: #34c759;
    --orange: #ff9f0a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  button:disabled { opacity: .4; }
  svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #video.mirror { transform: scaleX(-1); }
  #blink { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #blink.on { opacity: .85; transition: none; }

  .glass { background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 999px; font-size: 15px; font-weight: 600; }
  .round { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

  #top {
    position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 12px; right: 12px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  }
  #relayPill { align-items: flex-start; border-radius: 18px; max-width: calc(100% - 124px); cursor: pointer; }
  .topBtns { display: flex; gap: 8px; flex: none; }
  #relayPill .txt { display: flex; flex-direction: column; min-width: 0; }
  #relaySub { font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 9px; height: 9px; margin-top: 6px; border-radius: 50%; background: #8e8e93; flex: none; }
  .dot.ok { background: var(--green); }
  .dot.warn { background: var(--orange); }
  #galleryBtn { position: relative; }
  #badge {
    position: absolute; top: -3px; right: -3px; min-width: 20px; height: 20px; padding: 0 6px;
    border-radius: 10px; background: var(--red); font-size: 12px; font-weight: 700;
    display: none; align-items: center; justify-content: center;
  }

  #rec {
    position: fixed; top: calc(env(safe-area-inset-top) + 74px); left: 50%; transform: translateX(-50%);
    background: var(--red); display: none; font-variant-numeric: tabular-nums;
  }
  #count {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 40vmin; font-weight: 700; text-shadow: 0 4px 30px rgba(0, 0, 0, .6); pointer-events: none;
  }
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 190px); transform: translateX(-50%);
    opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; max-width: 92vw;
  }
  #toast.on { opacity: 1; }

  #bottom {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 30px 16px calc(env(safe-area-inset-bottom) + 18px);
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    background: linear-gradient(to top, rgba(0, 0, 0, .6), transparent);
  }
  #modes { display: flex; padding: 3px; border-radius: 999px; }
  #modes button { padding: 7px 20px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); }
  #modes button.sel { background: rgba(255, 255, 255, .92); color: #000; }
  #row { width: 100%; max-width: 420px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  #left { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  #left .pill { padding: 7px 11px; font-size: 14px; }
  #right { display: flex; justify-content: flex-end; }
  #shutter { width: 82px; height: 82px; border-radius: 50%; border: 5px solid #fff; display: flex; align-items: center; justify-content: center; }
  #shutter i { display: block; width: 64px; height: 64px; border-radius: 50%; background: #fff; transition: all .2s; }
  #shutter.video i { background: var(--red); }
  #shutter.recording i { width: 30px; height: 30px; border-radius: 7px; }
  #shutter:active i { transform: scale(.9); }
  .lit { color: #ffd60a; }

  .overlay {
    position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
    padding: 20px; background: rgba(0, 0, 0, .85);
  }
  .overlay.show { display: flex; }
  .card { width: 100%; max-width: 380px; padding: 24px; border-radius: 22px; background: #1c1c1e; text-align: center; }
  .card h1 { margin: 6px 0 4px; font-size: 24px; }
  .card h2 { margin: 0 0 4px; font-size: 20px; }
  .card p { margin: 8px 0 16px; color: var(--muted); line-height: 1.45; font-size: 15px; }
  .card .logo { width: 64px; height: 64px; border-radius: 15px; }
  .primary { width: 100%; padding: 14px; border-radius: 14px; background: #fff; color: #000; font-weight: 700; font-size: 17px; }
  .secondary { width: 100%; padding: 12px; border-radius: 14px; background: #2c2c2e; font-weight: 600; margin-top: 10px; }
  .danger { color: var(--red); }
  .error { color: #ff6961; font-size: 14px; margin: 12px 0 0; min-height: 1em; }
  label.check { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 0 0 18px; color: var(--muted); font-size: 15px; }
  label.check input { width: 20px; height: 20px; }
  input[type=text] {
    width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #3a3a3c;
    background: #000; color: #fff; font-size: 16px; -webkit-user-select: text; user-select: text;
  }
  #gallery .card { max-height: 86vh; display: flex; flex-direction: column; }
  .field { text-align: left; margin: 0 0 18px; }
  .field .label { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: #2c2c2e; }
  .seg button { flex: 1; padding: 10px 0; border-radius: 9px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .seg button.sel { background: #fff; color: #000; }
  .field .note { font-size: 13px; color: var(--orange); margin-top: 7px; line-height: 1.35; }
  #thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; overflow-y: auto; margin: 12px 0; }
  #thumbs img, #thumbs video { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; background: #000; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<div id="blink"></div>
<div id="count"></div>

<div id="top">
  <div class="pill glass" id="relayPill" role="button" data-i18n-aria="ariaRelay">
    <span class="dot" id="relayDot"></span>
    <span class="txt"><span id="relayText"></span><span id="relaySub"></span></span>
  </div>
  <div class="topBtns">
    <button class="round glass" id="settingsBtn" data-i18n-aria="ariaSettings">
      <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="round glass" id="galleryBtn" data-i18n-aria="ariaGallery">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
      <span id="badge"></span>
    </button>
  </div>
</div>
<div class="pill" id="rec">REC 0:00</div>
<div class="pill glass" id="toast"></div>

<div id="bottom">
  <div id="modes" class="glass">
    <button data-mode="photo" class="sel" data-i18n="photo"></button>
    <button data-mode="video" data-i18n="video"></button>
  </div>
  <div id="row">
    <div id="left">
      <button class="pill glass" id="torchBtn" data-i18n-aria="ariaTorch">
        <svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span id="torchText"></span>
      </button>
      <button class="pill glass" id="timerBtn" data-i18n-aria="ariaTimer">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span id="timerText"></span>
      </button>
    </div>
    <button id="shutter"><i></i></button>
    <div id="right">
      <button class="round glass" id="flipBtn" data-i18n-aria="ariaFlip">
        <svg viewBox="0 0 24 24"><path d="M3 9a2 2 0 0 1 2-2h2l2-3h6l2 3h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M15.5 12.5a3.5 3.5 0 0 0-6.2-2.2M8.5 13.5a3.5 3.5 0 0 0 6.2 2.2"/><path d="M9.5 8.5v2h2M14.5 17.5v-2h-2"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Pair with a watch: enter the code the watch shows -->
<div class="overlay" id="setup">
  <div class="card">
    <img class="logo" src="icon-180.png" alt="">
    <h1 data-i18n="setupTitle"></h1>
    <p data-i18n-html="setupText"></p>
    <input type="text" id="topicInput" inputmode="numeric" placeholder="123-456-7890" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="primary" id="topicSave" data-i18n="pair"></button>
    <button class="secondary" id="topicCancel" data-i18n="cancel"></button>
    <div class="error" id="setupError"></div>
  </div>
</div>

<!-- Needs one tap: browsers only start camera, sound and "screen stays on" after a tap -->
<div class="overlay" id="start">
  <div class="card">
    <img class="logo" src="icon-180.png" alt="">
    <h1>Cam Remote</h1>
    <p data-i18n-html="startText"></p>
    <label class="check"><input type="checkbox" id="soundChk"> <span data-i18n="sound"></span></label>
    <button class="primary" id="startBtn" data-i18n="startCamera"></button>
    <button class="secondary" id="startSettings" data-i18n="settingsTitle"></button>
    <div class="error" id="startError"></div>
  </div>
</div>

<div class="overlay" id="gallery">
  <div class="card">
    <h2 id="galleryTitle"></h2>
    <p id="galleryHint" data-i18n-html="galleryHint"></p>
    <div id="thumbs"></div>
    <button class="primary" id="saveBtn" data-i18n="saveToPhotos"></button>
    <button class="secondary danger" id="clearBtn" data-i18n="clearAll"></button>
    <button class="secondary" id="closeGallery" data-i18n="close"></button>
  </div>
</div>

<!-- Default settings: where the camera starts each time the watch app opens -->
<div class="overlay" id="settings">
  <div class="card">
    <h2 data-i18n="settingsTitle"></h2>
    <p data-i18n="settingsHint"></p>
    <div class="field"><div class="label" data-i18n="setTimer"></div><div class="seg" id="segTimer"></div></div>
    <div class="field"><div class="label" data-i18n="setCamera"></div><div class="seg" id="segFacing"></div></div>
    <div class="field"><div class="label" data-i18n="setTorch"></div><div class="seg" id="segTorch"></div><div class="note" id="torchNote"></div></div>
    <button class="primary" id="closeSettings" data-i18n="done"></button>
  </div>
</div>

 * Cam Remote web page.
 * The Garmin watch app publishes commands to an ntfy.sh topic (the personal code in the link).
 * This page listens on that topic, runs the camera, and keeps photos/videos until you save them to Photos.
 *
 *   watch -> page:  "cmd=shutter&seq=7&sid=123&mode=photo&camera=back&flash=off&timer=3"   (topic <code>)
 *   page -> watch:  "sid=123&ack=1&mode=photo&camera=back&flash=off&timer=0&rec=0&el=0&cam=1"  (topic <code>-s,
 *                   only in reply to cmd=hello, to stay within ntfy.sh's free limits)
 */

const $ = (id) => document.getElementById(id);
const RELAY = 'https://ntfy.sh/';
const TOPIC_RE = /^[-_A-Za-z0-9]{8,60}$/;
const TIMER_OPTIONS = [0, 3, 5, 10, 20, 30];   // self-timer choices on the phone; the watch may send 0..60
const validTimer = (t) => Number.isInteger(t) && t >= 0 && t <= 60;

function pickLang() {
  const forced = new URLSearchParams(location.search).get('lang');
  const wanted = [forced, ...(navigator.languages || []), navigator.language].filter(Boolean);
  for (const l of wanted) {
    const code = String(l).toLowerCase().slice(0, 2);
    if (I18N[code]) return code;
  }
  return 'en';
}
const LANG = pickLang();

function t(key, vars) {
  let s = (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key;
  if (vars) Object.keys(vars).forEach((k) => { s = s.split('{' + k + '}').join(String(vars[k])); });
  return s;
}

// Static texts. data-i18n-html only ever receives our own strings above, never user or relay data.
function applyStaticTexts() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
}

function store(key, value) { try { localStorage.setItem('camremote.' + key, value); } catch (e) { /* private mode */ } }
function load(key) { try { return localStorage.getItem('camremote.' + key); } catch (e) { return null; } }

// Default settings, chosen on the settings screen. They are the starting point when the page loads
// and every time the watch app starts (cmd=hello); the watch then adopts them.
function loadDefaults() {
  const timer = load('defTimer') !== null ? load('defTimer') : load('timer');   // 'timer'/'facing': older versions
  const facing = load('defFacing') || load('facing');
  return {
    timer: timer !== null && TIMER_OPTIONS.includes(Number(timer)) ? Number(timer) : 0,
    facing: facing === 'user' ? 'user' : 'environment',
    torch: load('defTorch') === '1',
  };
}
const D = loadDefaults();

const S = {
  topic: null,
  mode: 'photo',
  facing: D.facing,
  torch: D.torch,
  timer: D.timer,
  sound: load('sound') !== '0',
  camReady: false,
  videoTrack: null,
  audioTrack: null,
  torchSupported: false,
  switching: null,   // promise while the lens is being switched
  recorder: null,
  recording: false,
  recStart: 0,
  countdown: 0,
  countdownTimer: null,
  seen: [],
  media: [],
};

// ---------------------------------------------------------------- UI helpers

function show(id) { $(id).classList.add('show'); }
function hide(id) { $(id).classList.remove('show'); }

let toastTimer = null;
function toast(text, ms = 2200) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), ms);
}

function blink() {
  const el = $('blink');
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 90);
}

let actx = null;
function initAudio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    actx.resume();
  } catch (e) { actx = null; }
}
function beep(freq, seconds) {
  if (!actx) return;
  try {
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.18, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + seconds);
    osc.connect(gain).connect(actx.destination);
    osc.start();
    osc.stop(actx.currentTime + seconds + 0.02);
  } catch (e) { /* sound is optional */ }
}

function renderControls() {
  document.querySelectorAll('#modes button').forEach((b) => {
    b.classList.toggle('sel', b.dataset.mode === S.mode);
    b.disabled = S.recording;
  });
  const sh = $('shutter');
  sh.classList.toggle('video', S.mode === 'video');
  sh.classList.toggle('recording', S.recording);
  sh.setAttribute('aria-label', t(S.mode === 'photo' ? 'shutterPhoto' : (S.recording ? 'shutterStop' : 'shutterStart')));
  $('torchText').textContent = t(S.torch ? 'on' : 'off');
  $('torchBtn').classList.toggle('lit', S.torch);
  $('timerText').textContent = S.timer ? S.timer + 's' : t('off');
  $('flipBtn').disabled = S.recording;
  $('rec').style.display = S.recording ? 'inline-flex' : 'none';
  $('video').classList.toggle('mirror', S.facing === 'user');
}

function renderBadge() {
  const n = S.media.length;
  $('badge').textContent = n > 99 ? '99+' : String(n);
  $('badge').style.display = n ? 'flex' : 'none';
}

setInterval(() => {
  if (!S.recording) return;
  const s = Math.floor((Date.now() - S.recStart) / 1000);
  $('rec').textContent = `REC ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}, 500);

// ---------------------------------------------------------------- relay (ntfy.sh)

let es = null;
let relayOpen = false;
let lastCmd = null;

function renderRelay() {
  $('relayDot').className = 'dot ' + (relayOpen ? 'ok' : 'warn');
  $('relayText').textContent = t(relayOpen ? 'ready' : 'connecting');
  $('relaySub').textContent = lastCmd
    ? t('lastCmd', lastCmd)
    : (S.topic ? t('codeHint', { code: topicToCode(S.topic) }) : t('openWatch'));
}

function connectRelay() {
  if (es) es.close();
  es = new EventSource(RELAY + encodeURIComponent(S.topic) + '/sse');
  es.onopen = () => { relayOpen = true; renderRelay(); };
  es.onerror = () => { relayOpen = false; renderRelay(); };   // the browser reconnects by itself
  es.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch (err) { return; }
    if (m && m.event === 'message' && typeof m.message === 'string') onCommand(m.message, m.time);
  };
}

function publishStatus(sid, ack) {
  const body = new URLSearchParams({
    sid: sid || '', ack: ack || '',
    mode: S.mode,
    camera: S.facing === 'user' ? 'front' : 'back',
    flash: S.torch ? 'on' : 'off',
    timer: String(S.timer),
    rec: S.recording ? '1' : '0',
    el: S.recording ? String(Math.floor((Date.now() - S.recStart) / 1000)) : '0',
    cam: S.camReady ? '1' : '0',
  }).toString();
  fetch(RELAY + encodeURIComponent(S.topic) + '-s', { method: 'POST', body, mode: 'no-cors', keepalive: true })
    .catch(() => {});
}

function onCommand(text, time) {
  const p = new URLSearchParams(text);
  const cmd = p.get('cmd');
  if (!cmd) return;
  const key = p.get('sid') + ':' + p.get('seq');
  if (S.seen.includes(key)) return;
  S.seen.push(key);
  if (S.seen.length > 100) S.seen.splice(0, 50);
  if (time && Date.now() / 1000 - time > 30) return;   // too old, e.g. delivered after a long hiccup

  const now = new Date();
  lastCmd = {
    label: t({ hello: 'cmdHello', shutter: (p.get('mode') || S.mode) === 'video' ? 'cmdVideo' : 'cmdPhoto', set: 'cmdSet' }[cmd] || cmd),
    time: now.toLocaleTimeString(LANG, { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
  };
  renderRelay();

  if (cmd === 'hello') {
    applyDefaults();   // the watch app just started: begin from the default settings
    publishStatus(p.get('sid'), p.get('seq'));
    return;
  }
  applySettings(p);
  if (cmd === 'shutter') shutter();
}

// The watch sends its full settings with every command; the watch is in charge.
function applySettings(p) {
  const mode = p.get('mode');
  if ((mode === 'photo' || mode === 'video') && !S.recording) setMode(mode);
  const cam = p.get('camera');
  if (cam === 'front' || cam === 'back') setFacing(cam === 'front' ? 'user' : 'environment');
  const flash = p.get('flash');
  if (flash === 'on' || flash === 'off') setTorch(flash === 'on');
  const t = p.get('timer');
  if (t !== null && validTimer(Number(t))) setTimer(Number(t));
}

// ---------------------------------------------------------------- camera

// Ask for the wanted camera strictly ("exact"). With only a preference, Safari may keep the rear camera
// when switching to selfie, because the rear camera matches the 4K wish better than the selfie camera.
// Devices that can't tell which way a camera faces (desktop webcams) get the preference instead.
function videoConstraints(strict) {
  return {
    facingMode: strict ? { exact: S.facing } : { ideal: S.facing },
    width: { ideal: 3840 },
    height: { ideal: 2160 },
  };
}

async function getCameraStream(withAudio) {
  try {
    return await navigator.mediaDevices.getUserMedia({ video: videoConstraints(true), audio: withAudio });
  } catch (err) {
    if (err.name !== 'OverconstrainedError' && err.name !== 'NotFoundError') throw err;
    return navigator.mediaDevices.getUserMedia({ video: videoConstraints(false), audio: withAudio });
  }
}

function attachVideo(track) {
  S.videoTrack = track;
  // Trust what the camera reports, so the mirror view and the watch match the lens that is really on.
  const actual = track.getSettings ? track.getSettings().facingMode : null;
  if (actual === 'user' || actual === 'environment') S.facing = actual;
  const v = $('video');
  v.srcObject = new MediaStream([track]);
  v.play().catch(() => {});
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  S.torchSupported = !!(caps && caps.torch);
  applyTorch();
  renderControls();
}

async function startCamera() {
  initAudio();
  S.sound = $('soundChk').checked;
  store('sound', S.sound ? '1' : '0');
  $('startError').textContent = '';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    $('startError').textContent = t('noBrowserCam');
    return;
  }
  try {
    let stream;
    try {
      stream = await getCameraStream(S.sound);
    } catch (err) {
      if (!S.sound || err.name !== 'NotAllowedError') throw err;
      S.sound = false;   // microphone refused: carry on without sound
      stream = await getCameraStream(false);
    }
    S.audioTrack = stream.getAudioTracks()[0] || null;
    attachVideo(stream.getVideoTracks()[0]);
    S.camReady = true;
    hide('start');
    requestWakeLock();
    toast(t('camReady'));
  } catch (err) {
    $('startError').textContent = err && err.name === 'NotAllowedError'
      ? t('camDenied')
      : t('camFailed', { error: (err && err.name) || '?' });
  }
}

async function restartVideo() {
  if (S.videoTrack) S.videoTrack.stop();
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const s = await getCameraStream(false);
      attachVideo(s.getVideoTracks()[0]);
      return true;
    } catch (err) {
      await new Promise((r) => setTimeout(r, 400));   // iOS sometimes needs a moment to release the previous lens
    }
  }
  return false;
}

async function setFacing(facing) {
  if (facing === S.facing || S.recording) return;
  S.facing = facing;
  renderControls();
  if (!S.camReady) return;
  S.switching = restartVideo();
  const ok = await S.switching;
  S.switching = null;
  if (!ok) toast(t('flipFailed'));
}

function setMode(mode) {
  if (S.recording || mode === S.mode) return;
  cancelCountdown();
  S.mode = mode;
  renderControls();
}

function setTimer(seconds) {
  S.timer = seconds;
  renderControls();
}

// ---------------------------------------------------------------- default settings

function applyDefaults() {
  if (S.recording || S.countdownTimer) return;
  setTimer(D.timer);
  setTorch(D.torch);
  setFacing(D.facing);
}

function setDefault(key, value) {
  D[key] = value;
  if (key === 'timer') store('defTimer', String(value));
  else if (key === 'facing') store('defFacing', value);
  else store('defTorch', value ? '1' : '0');
  // Show the new default right away, unless a recording or countdown is running.
  if (!S.recording && !S.countdownTimer) {
    if (key === 'timer') setTimer(value);
    else if (key === 'facing') setFacing(value);
    else setTorch(value);
  }
  renderSettings();
}

function buildSegment(id, options, current, onPick) {
  const box = $(id);
  box.textContent = '';
  options.forEach(([value, label]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    if (value === current) b.classList.add('sel');
    b.addEventListener('click', () => onPick(value));
    box.appendChild(b);
  });
}

function renderSettings() {
  buildSegment('segTimer', TIMER_OPTIONS.map((s) => [s, s ? s + 's' : t('off')]), D.timer, (v) => setDefault('timer', v));
  buildSegment('segFacing', [['environment', t('camBack')], ['user', t('camSelfie')]], D.facing, (v) => setDefault('facing', v));
  buildSegment('segTorch', [[false, t('off')], [true, t('on')]], D.torch, (v) => setDefault('torch', v));
  $('torchNote').textContent = (D.torch && S.camReady && !S.torchSupported) ? t('torchUnsupported') : '';
}

function openSettings() {
  renderSettings();
  show('settings');
}

function setTorch(on) {
  S.torch = on;
  applyTorch();
  renderControls();
}

async function applyTorch() {
  if (!S.videoTrack || !S.torchSupported) return;
  try { await S.videoTrack.applyConstraints({ advanced: [{ torch: S.torch }] }); } catch (e) { /* not supported */ }
}

// ---------------------------------------------------------------- capture

function shutter() {
  initAudio();
  if (S.countdownTimer) {
    cancelCountdown();
    toast(t('cancelled'));
    return;
  }
  if (S.mode === 'video' && S.recording) {
    stopRecording();
    return;
  }
  if (!S.camReady) {
    toast(t('tapStartFirst'));
    return;
  }
  if (S.timer > 0) startCountdown();
  else fire();
}

async function fire() {
  if (S.switching) await S.switching;   // a lens switch from the same command is still running
  if (S.mode === 'video') startRecording();
  else takePhoto();
}

function startCountdown() {
  S.countdown = S.timer;
  const el = $('count');
  el.textContent = S.countdown;
  el.style.display = 'flex';
  beep(660, 0.08);
  S.countdownTimer = setInterval(() => {
    S.countdown -= 1;
    if (S.countdown <= 0) {
      cancelCountdown();
      fire();
    } else {
      el.textContent = S.countdown;
      if (S.countdown <= 5) beep(660, 0.08);   // long timers only beep for the last 5 seconds
    }
  }, 1000);
}

function cancelCountdown() {
  if (S.countdownTimer) clearInterval(S.countdownTimer);
  S.countdownTimer = null;
  S.countdown = 0;
  $('count').style.display = 'none';
}

function takePhoto() {
  const v = $('video');
  const w = v.videoWidth;
  const h = v.videoHeight;
  if (!w || !h) {
    toast(t('camNotReady'));
    return;
  }
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  canvas.getContext('2d').drawImage(v, 0, 0, w, h);
  blink();
  beep(1800, 0.05);
  canvas.toBlob((blob) => {
    if (blob) addMedia(blob, 'jpg');
    else toast(t('photoFailed'));
  }, 'image/jpeg', 0.92);
}

async function ensureAudio() {
  if (!S.sound) return;
  if (S.audioTrack && S.audioTrack.readyState === 'live') return;
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    S.audioTrack = s.getAudioTracks()[0] || null;
  } catch (e) {
    S.audioTrack = null;
  }
}

async function startRecording() {
  if (!window.MediaRecorder) {
    toast(t('videoUnsupported'));
    return;
  }
  await ensureAudio();
  const tracks = [S.videoTrack];
  if (S.sound && S.audioTrack && S.audioTrack.readyState === 'live') tracks.push(S.audioTrack);
  const types = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
  const type = types.find((t) => MediaRecorder.isTypeSupported(t));
  let rec;
  try {
    rec = new MediaRecorder(new MediaStream(tracks), type ? { mimeType: type } : undefined);
  } catch (e) {
    toast(t('videoFailed'));
    return;
  }
  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const mime = rec.mimeType || type || 'video/mp4';
    addMedia(new Blob(chunks, { type: mime }), mime.includes('webm') ? 'webm' : 'mp4');
  };
  rec.start(1000);
  S.recorder = rec;
  S.recording = true;
  S.recStart = Date.now();
  $('rec').textContent = 'REC 0:00';
  beep(880, 0.15);
  renderControls();
}

function stopRecording() {
  if (S.recorder && S.recorder.state !== 'inactive') S.recorder.stop();
  S.recorder = null;
  S.recording = false;
  beep(440, 0.15);
  renderControls();
}

// ---------------------------------------------------------------- storage (survives a reload)

let dbPromise = null;
function idb() {
  if (!dbPromise) {
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open('camremote', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('media', { keyPath: 'id', autoIncrement: true });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  return dbPromise;
}

async function idbRun(mode, fn) {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('media', mode);
    const req = fn(tx.objectStore('media'));
    tx.oncomplete = () => resolve(req ? req.result : undefined);
    tx.onerror = () => reject(tx.error);
  });
}

async function addMedia(blob, ext) {
  const item = { created: Date.now(), type: blob.type, ext, blob };
  try {
    item.id = await idbRun('readwrite', (st) => st.add({ created: item.created, type: item.type, ext, blob }));
  } catch (e) {
    item.id = null;   // kept in memory only
  }
  S.media.push(item);
  renderBadge();
  toast(t(ext === 'jpg' ? 'photoTaken' : 'videoTaken', { n: S.media.length }));
}

async function loadMedia() {
  try {
    const all = await idbRun('readonly', (st) => st.getAll());
    S.media = (all || []).filter((m) => m && m.blob);
  } catch (e) {
    S.media = [];
  }
  renderBadge();
}

async function clearMedia() {
  try { await idbRun('readwrite', (st) => st.clear()); } catch (e) { /* ignore */ }
  S.media = [];
  renderBadge();
}

// ---------------------------------------------------------------- gallery & saving to Photos

let thumbUrls = [];

function fileName(m) {
  const d = new Date(m.created);
  const p = (n) => String(n).padStart(2, '0');
  const stamp = `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  return `${m.ext === 'jpg' ? 'IMG' : 'VID'}_${stamp}_${m.created % 1000}.${m.ext}`;
}

function openGallery() {
  thumbUrls.forEach((u) => URL.revokeObjectURL(u));
  thumbUrls = [];
  const box = $('thumbs');
  box.textContent = '';
  S.media.slice(-60).reverse().forEach((m) => {
    const url = URL.createObjectURL(m.blob);
    thumbUrls.push(url);
    const isVideo = (m.type || '').startsWith('video');
    const el = document.createElement(isVideo ? 'video' : 'img');
    el.src = url;
    if (isVideo) { el.muted = true; el.playsInline = true; el.preload = 'metadata'; }
    box.appendChild(el);
  });
  const n = S.media.length;
  $('galleryTitle').textContent = n ? (n === 1 ? t('galleryOne') : t('galleryMany', { n })) : t('galleryEmpty');
  $('galleryHint').style.display = n ? '' : 'none';
  $('saveBtn').disabled = !n;
  $('clearBtn').disabled = !n;
  show('gallery');
}

async function saveAll() {
  const files = S.media.map((m) => new File([m.blob], fileName(m), {
    type: m.type || (m.ext === 'jpg' ? 'image/jpeg' : 'video/mp4'),
  }));
  if (!files.length) return;
  if (navigator.canShare && navigator.canShare({ files })) {
    try {
      await navigator.share({ files });
      if (confirm(t('confirmAfterShare'))) {
        await clearMedia();
        openGallery();
      }
    } catch (err) {
      if (err && err.name !== 'AbortError') toast(t('shareFailed', { error: err.name }));
    }
  } else {
    // Desktop browsers: download the files instead.
    files.forEach((f) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(f);
      a.download = f.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
  }
}

// ---------------------------------------------------------------- keep the screen on

let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) { wakeLock = null; }
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  if (S.topic && (!es || es.readyState === EventSource.CLOSED)) connectRelay();
  if (S.camReady) {
    requestWakeLock();
    if (!S.videoTrack || S.videoTrack.readyState === 'ended') {
      if (!(await restartVideo())) {
        S.camReady = false;
        show('start');
      }
    }
  }
});

// ---------------------------------------------------------------- wiring

// The watch shows a 10-digit pairing code ("482-093-7556"); its relay topic is "cr-" + the digits.
// Full topics from older links ("cr-…") and the earlier 8-character codes keep working.
function codeToTopic(input) {
  let s = String(input || '').trim();
  try { s = decodeURIComponent(s); } catch (e) { /* keep as typed */ }
  s = s.replace(/^.*#(k=)?/, '');
  if (/^cr-[A-Za-z0-9]{8,40}$/.test(s)) return s;
  const digits = s.replace(/[^0-9]/g, '');
  if (digits.length === 10 && /^[0-9\s\-.]+$/.test(s)) return 'cr-' + digits;
  const c = s.toLowerCase().replace(/[^a-z0-9]/g, '');
  return c.length === 8 ? 'cr-' + c : null;
}

function topicToCode(topic) {
  const c = topic.replace(/^cr-/, '');
  if (/^[0-9]{10}$/.test(c)) return `${c.slice(0, 3)}-${c.slice(3, 6)}-${c.slice(6)}`;
  return c.length === 8 ? `${c.slice(0, 4)}-${c.slice(4)}` : topic;
}

function readTopic() {
  const fromHash = location.hash.length > 1 ? codeToTopic(location.hash.slice(1)) : null;
  if (fromHash) { store('topic', fromHash); return fromHash; }
  const fromQuery = codeToTopic(new URLSearchParams(location.search).get('k'));
  if (fromQuery) { store('topic', fromQuery); return fromQuery; }
  const saved = load('topic');
  return saved && TOPIC_RE.test(saved) ? saved : null;
}

function openSetup() {
  $('topicInput').value = S.topic ? topicToCode(S.topic) : '';
  $('topicCancel').style.display = S.topic ? '' : 'none';
  $('setupError').textContent = '';
  show('setup');
}

$('shutter').addEventListener('click', shutter);
$('modes').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b) setMode(b.dataset.mode);
});
$('torchBtn').addEventListener('click', () => {
  if (S.camReady && !S.torchSupported) toast(t('torchUnsupported'));
  setTorch(!S.torch);
});
$('timerBtn').addEventListener('click', () => {
  const i = TIMER_OPTIONS.indexOf(S.timer);
  setTimer(TIMER_OPTIONS[(i + 1) % TIMER_OPTIONS.length]);
});
$('flipBtn').addEventListener('click', () => setFacing(S.facing === 'user' ? 'environment' : 'user'));
$('galleryBtn').addEventListener('click', openGallery);
$('settingsBtn').addEventListener('click', openSettings);
$('startSettings').addEventListener('click', openSettings);
$('closeSettings').addEventListener('click', () => hide('settings'));
$('closeGallery').addEventListener('click', () => hide('gallery'));
$('saveBtn').addEventListener('click', saveAll);
$('clearBtn').addEventListener('click', async () => {
  if (confirm(t('confirmClear'))) {
    await clearMedia();
    openGallery();
  }
});
$('startBtn').addEventListener('click', startCamera);
$('topicSave').addEventListener('click', () => {
  const topic = codeToTopic($('topicInput').value);
  if (!topic) {
    $('setupError').textContent = t('badCode');
    return;
  }
  store('topic', topic);
  lastCmd = null;
  // Keep the code in the address, so "Zet op beginscherm" remembers it.
  history.replaceState(null, '', location.pathname + location.search + '#' + topicToCode(topic));
  boot();
});
$('topicCancel').addEventListener('click', () => hide('setup'));
$('relayPill').addEventListener('click', openSetup);

function boot() {
  S.topic = readTopic();
  renderControls();
  renderRelay();
  if (!S.topic) {
    openSetup();
    return;
  }
  hide('setup');
  $('soundChk').checked = S.sound;
  if (!S.camReady) show('start');
  connectRelay();
}

window.addEventListener('hashchange', () => { if (!S.camReady) { lastCmd = null; boot(); } });
applyStaticTexts();
loadMedia();
boot();
</script>
